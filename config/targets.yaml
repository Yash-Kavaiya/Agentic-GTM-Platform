# Bellwether target accounts.
#
# Mid-market B2B SaaS companies — the shape of company that actually shows the
# "moving upmarket" signals Bellwether watches for.
#
# `paths` overrides the default path from the signal template when a company
# files a page somewhere non-standard. Anything not overridden uses the
# signal's own `path`.
#
# `jobs` is a public job-board binding. All three supported providers expose
# documented, unauthenticated JSON endpoints — no login wall, no personal data:
#   greenhouse  https://boards-api.greenhouse.io/v1/boards/<token>/jobs?content=true
#   lever       https://api.lever.co/v0/postings/<token>?mode=json
#   ashby       https://api.ashbyhq.com/posting-api/job-board/<token>
#
# Every entry here is VERIFIED by `npm run probe` before any collector is
# provisioned against it. Unverified paths are never sent to `scraper create`.

version: 1

targets:
  - id: posthog
    name: PostHog
    domain: posthog.com
    jobs: { provider: ashby, token: posthog }

  - id: cal
    name: Cal.com
    domain: cal.com

